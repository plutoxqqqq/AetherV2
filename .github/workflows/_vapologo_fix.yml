name: Apply VapeLogo fix

on:
  push:
    branches: [fix/vapologo-errors]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch VapeLogo asset references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacement = "VapeLogo.Image = getcustomasset('aetherv2/assets/new/guivape.png')"
          fixed = "VapeLogo.Image = getcustomasset('aetherv2/assets/new/aetherlogo.png')"

          for name in ('guis/new.lua', 'guis/old.lua'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if replacement not in text:
                  raise SystemExit(f'No VapeLogo reference found in {name}')
              path.write_text(text.replace(replacement, fixed), encoding='utf-8')

          Path('.github/workflows/_vapologo_fix.yml').unlink()
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guis/new.lua guis/old.lua .github/workflows/_vapologo_fix.yml
          git commit -m "fix: replace broken VapeLogo asset"
          git push
