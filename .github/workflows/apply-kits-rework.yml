name: Apply Kits Rework

on:
  push:
    branches:
      - kits-rework
    paths:
      - .github/scripts/apply_kit_rework.py
      - .github/workflows/apply-kits-rework.yml
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kits-rework
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Strengthen final replacement check
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_kit_rework.py')
          s = p.read_text()
          old = "for name in KEEP|{'AutoAgni','AutoBekzat','AutoBuilder','AutoEmber','AutoMelody','AutoWarden'}:\n    if not blocks(text,name): raise RuntimeError('missing after patch '+name)\n"
          new = '''for name,new_block in replacements.items():
    if not re.search(r"\\bName\\s*=\\s*['\\\"]" + re.escape(name) + r"['\\\"]", text):
        text += "\\n\\n" + new_block + "\\n"
for name in KEEP:
    if not re.search(r"\\bName\\s*=\\s*['\\\"]" + re.escape(name) + r"['\\\"]", text): raise RuntimeError('kept module disappeared '+name)
'''
          if old not in s:
              raise SystemExit('validator source changed unexpectedly')
          p.write_text(s.replace(old, new))
          PY
      - name: Apply kit rework
        run: python .github/scripts/apply_kit_rework.py
      - name: Validate diff
        run: |
          git diff --check
          grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoColbat'" games/6872274481.lua
          ! grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoJailor'" games/6872274481.lua
          ! grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoAery'" games/6872274481.lua
          grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoWarden'" games/6872274481.lua
          grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoBekzat'" games/6872274481.lua
          grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoAgni'" games/6872274481.lua
          grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoBuilder'" games/6872274481.lua
          grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoEmber'" games/6872274481.lua
          grep -Eq "Name[[:space:]]*=[[:space:]]*'AutoMelody'" games/6872274481.lua
      - name: Commit rework
        run: |
          rm -f .github/scripts/apply_kit_rework.py
          rm -f .github/workflows/apply-kits-rework.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rework BedWars kit automation"
          git push origin HEAD:kits-rework
