name: Apply Vape-style game split

on:
  push:
    paths:
      - tools/split-games.py
      - .github/workflows/apply-split.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split monoliths
        run: python3 tools/split-games.py
      - name: Commit split tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f games/universal.lua games/6872274481.lua
          rm -f games/6872274481/blatant/x.lua games/universal/blatant/x.lua
          git add games tools .github/workflows/apply-split.yml
          git add -u games
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Split BedWars and universal monoliths into Vape-style modules"
          git push
