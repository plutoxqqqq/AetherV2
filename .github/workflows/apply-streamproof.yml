name: Apply StreamProof runtime integration
on:
  push:
    branches: [feat/streamproof]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        shell: python
        run: |
          from pathlib import Path

          universal = Path('games/universal.lua')
          text = universal.read_text()
          marker = "loadstring(downloadFile('aetherv2/games/universal/utility/StreamProof.lua'), 'StreamProof')(license)"
          if marker not in text:
              text += "\n\n-- Universal utility modules kept as independent source files.\n" + marker + "\n"
              universal.write_text(text)

          drawing = Path('libraries/drawing.lua')
          text = drawing.read_text()
          text = text.replace(
              "local drawingrefs, queued, thread = {}, {}\n",
              "local drawingrefs, queued, thread = {}, {}\nlocal visibilitySuppressed = false\nlocal desiredVisible = {}\n"
          )
          text = text.replace(
              "\t\t\tdrawingrefs[ref] = obj\n\t\t\tcommchannel:Fire(true, 'new', props, ref, args[2])",
              "\t\t\tdrawingrefs[ref] = obj\n\t\t\tdesiredVisible[ref] = props.Visible\n\t\t\tif visibilitySuppressed then props.Visible = false end\n\t\t\tcommchannel:Fire(true, 'new', props, ref, args[2])"
          )
          text = text.replace(
              "\t\t\tfor i, v in args[1] do\n\t\t\t\tlocal obj = drawingrefs[i]\n\t\t\t\tif obj then\n\t\t\t\t\tfor propname, prop in v do\n\t\t\t\t\t\tobj[propname] = prop\n\t\t\t\t\tend\n\t\t\t\tend\n\t\t\tend\n\t\telseif key == 'remove' then",
              "\t\t\tfor i, v in args[1] do\n\t\t\t\tlocal obj = drawingrefs[i]\n\t\t\t\tif obj then\n\t\t\t\t\tfor propname, prop in v do\n\t\t\t\t\t\tif propname == 'Visible' then\n\t\t\t\t\t\t\tdesiredVisible[i] = prop\n\t\t\t\t\t\t\tif visibilitySuppressed then prop = false end\n\t\t\t\t\t\tend\n\t\t\t\t\t\tobj[propname] = prop\n\t\t\t\t\tend\n\t\t\t\tend\n\t\t\tend\n\t\telseif key == 'remove' then"
          )
          text = text.replace(
              "\t\t\t\tdrawingrefs[args[1]] = nil\n\t\t\tend\n\t\tend\n\tend\nend",
              "\t\t\t\tdrawingrefs[args[1]] = nil\n\t\t\t\tdesiredVisible[args[1]] = nil\n\t\t\tend\n\t\tend\n\tend\nend"
          )
          needle = "if isactor and not Drawing then"
          controller = """local controller = {\n\tSuppressed = false,\n\tSetSuppressed = function(self, enabled)\n\t\tvisibilitySuppressed = enabled == true\n\t\tself.Suppressed = visibilitySuppressed\n\t\tfor ref, obj in drawingrefs do\n\t\t\tif visibilitySuppressed then\n\t\t\t\tdesiredVisible[ref] = obj.Visible\n\t\t\t\tobj.Visible = false\n\t\t\telse\n\t\t\t\tobj.Visible = desiredVisible[ref] ~= false\n\t\t\tend\n\t\tend\n\tend\n}\nif getgenv then getgenv().AetherV2DrawingController = controller end\n\n"""
          if 'AetherV2DrawingController' not in text:
              text = text.replace(needle, controller + needle, 1)
          drawing.write_text(text)

          Path('.github/workflows/apply-streamproof.yml').unlink()
      - name: Commit runtime integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/universal.lua libraries/drawing.lua .github/workflows/apply-streamproof.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate StreamProof runtime support"
          git push
