name: BedWars structure build

on:
  push:
    branches:
      - codex/split-bedwars-modules-analytics
    paths:
      - .github/workflows/bedwars-structure.yml
      - tools/apply-bedwars-refactor.py
      - tools/apply-aug30-unfinished.py
      - tools/fix-aug30-verification.py
      - tools/patch-refactor-standalone.py
      - tools/patch-refactor-discord.py
      - tools/build-bedwars-bundle.py
      - games/6872274481/**
      - games/universal.lua
      - libraries/entity.lua
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/split-bedwars-modules-analytics
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch splitter for standalone modules
        run: python tools/patch-refactor-standalone.py
      - name: Patch existing Discord syntax
        run: python tools/patch-refactor-discord.py
      - name: Apply one-time structural refactor
        if: hashFiles('tools/apply-bedwars-refactor.py') != ''
        run: python tools/apply-bedwars-refactor.py
      - name: Apply remaining Aug 30 requests
        run: python tools/apply-aug30-unfinished.py
      - name: Apply verification fixes
        run: python tools/fix-aug30-verification.py
      - name: Rebuild BedWars runtime bundle
        run: python tools/build-bedwars-bundle.py
      - name: Validate backend JavaScript
        run: |
          node --check backend/private-source.js
          node --check backend/discord-bot.js
          node --check backend/execution-stats.js
      - name: Commit generated/refactored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/6872274481.lua games/6872274481 games/universal.lua libraries/entity.lua backend init.lua guis/new.core.lua tools backend/README.md backend/package.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Finish Aug 30 module and UI requests"
          git push origin HEAD:codex/split-bedwars-modules-analytics
