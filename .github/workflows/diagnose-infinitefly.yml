name: Diagnose InfiniteFly

on:
  push:
    branches:
      - codex/fix-cloud-mousetp-scaffold-infinitefly-liquidglass

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('games/universal.lua').read_text()
          old=subprocess.check_output(['git','show','a543c1cbdbaa0c1be9aea9c9458bdbfab5989f8c:games/universal.lua'], text=True)
          lines=[
            'current_space='+str(s.find('run(function()\n    local InfiniteFly')),
            'current_tab='+str(s.find('run(function()\n\tlocal InfiniteFly')),
            'high_space='+str(s.find('run(function()\n    local HighJump')),
            'high_tab='+str(s.find('run(function()\n\tlocal HighJump')),
            'old_space='+str(old.find('run(function()\n    -- InfiniteFly')),
            'old_tab='+str(old.find('run(function()\n\t-- InfiniteFly')),
            'old_end='+str(old.find('\nend)\n\nrun(function()')),
          ]
          Path('.infinitefly-debug.txt').write_text('\n'.join(lines)+'\n')
          PY
      - run: |
          rm -f .github/workflows/diagnose-infinitefly.yml _infinitefly-debug-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: record InfiniteFly diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
