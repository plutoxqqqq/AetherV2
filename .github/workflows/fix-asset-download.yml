name: Fix asset downloads

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-asset-download.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair asset download path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('guis/new.core.lua')
          text = path.read_text()

          start = text.index('local function encodeRemoteSource(value)')
          end = text.index('\nlocal function downloadFile(path, func)', start)
          public_remote = r'''local function encodeRemoteSource(value)
          	return tostring(value):gsub('([^%w%-%._~])', function(character)
          		return string.format('%%%02X', string.byte(character))
          	end)
          end

          local versionPinPath = 'aetherv2/profiles/version-pin.txt'

          local function sourceBranch()
          	return 'main'
          end

          local function installedSourceRef()
          	local ref = isfile('aetherv2/profiles/commit.txt') and readfile('aetherv2/profiles/commit.txt'):gsub('%s+', '') or ''
          	return ref ~= '' and ref or sourceBranch()
          end

          local function remoteSourceUrl(path, ref)
          	local selectedRef = ref or installedSourceRef()
          	return 'https://raw.githubusercontent.com/plutoxqqqq/AetherV2/'..selectedRef..'/'..
          		select(1, path:gsub('^aetherv2/', ''))
          end

          local function remoteLoaderUrl()
          	return 'https://raw.githubusercontent.com/plutoxqqqq/AetherV2/main/init.lua'
          end

          local function remoteCommitUrl(ref)
          	return 'https://api.github.com/repos/plutoxqqqq/AetherV2/commits/'..encodeRemoteSource(ref)
          end

          local function remoteHistoryUrl(limit)
          	local requested = math.clamp(tonumber(limit) or 11, 1, 11)
          	return 'https://api.github.com/repos/plutoxqqqq/AetherV2/commits?sha=main&per_page='..tostring(requested)
          end
          '''
          text = text[:start] + public_remote + text[end:]

          start = text.index('local function downloadFile(path, func)')
          end = text.index('\nlocal function getTableSize(tab)', start)
          downloader = r'''local function validDownloadedFile(path, body)
          	if type(body) ~= 'string' or #body < 8 then return false end
          	local head = body:sub(1, 300):lower()
          	if head:find('^%s*404') or head:find('^%s*429') or head:find('^%s*5%d%d:')
          		or head:find('<!doctype html') or head:find('<html') then
          		return false
          	end
          	if path:lower():sub(-4) == '.png' then
          		return body:sub(1, 8) == '\137PNG\r\n\26\n'
          	end
          	return true
          end

          local function ensureDownloadFolder(path)
          	local parent = path:gsub('\\', '/'):match('^(.*)/[^/]+$')
          	if not parent then return end
          	local built = ''
          	for segment in parent:gmatch('[^/]+') do
          		built = built == '' and segment or built..'/'..segment
          		if not isfolder(built) then pcall(makefolder, built) end
          	end
          end

          local function downloadFile(path, func)
          	local exists = isfile(path)
          	if exists then
          		local ok, cached = pcall(readfile, path)
          		if not ok or not validDownloadedFile(path, cached) then
          			if delfile then pcall(delfile, path) else pcall(writefile, path, '') end
          			exists = false
          		end
          	end

          	if not exists then
          		createDownloader(path)
          		local suc, res = pcall(function()
          			if type(shared.AetherV2FetchSource) == 'function' then
          				return shared.AetherV2FetchSource(path, installedSourceRef())
          			end
          			return game:HttpGet(remoteSourceUrl(path), true)
          		end)
          		if not suc then error(res) end
          		if not validDownloadedFile(path, res) then
          			error('Invalid GitHub response while downloading '..path, 0)
          		end
          		if path:sub(-4) == '.lua' then
          			res = '--This watermark is used to delete the file if its cached, remove it to make the file persist after vape updates.\n'..res
          		end
          		ensureDownloadFolder(path)
          		writefile(path, res)
          	end

          	return (func or readfile)(path)
          end

          -- Download/cache the file even when the executor cannot register custom local assets.
          -- assetfunction only controls whether we can display that cached file directly.
          getcustomasset = function(path)
          	local downloaded = pcall(downloadFile, path)
          	if assetfunction and downloaded then
          		local suc, res = pcall(assetfunction, path)
          		if suc then return res end
          	end
          	return getcustomassets[path] or ''
          end
          '''
          text = text[:start] + downloader + text[end:]
          path.write_text(text)

          # Old/Rise should also cache their requested assets even if getcustomasset is absent.
          old_get = """getcustomasset = not inputService.TouchEnabled and assetfunction and function(path)\n\tlocal success, result = pcall(downloadFile, path, assetfunction)\n\tif success then return result end\n\treturn getcustomassets[path] or ''\nend or function(path)\n\treturn getcustomassets[path] or ''\nend"""
          new_get = """getcustomasset = function(path)\n\tlocal downloaded = pcall(downloadFile, path)\n\tif not inputService.TouchEnabled and assetfunction and downloaded then\n\t\tlocal success, result = pcall(assetfunction, path)\n\t\tif success then return result end\n\tend\n\treturn getcustomassets[path] or ''\nend"""
          for gui in ('guis/old.lua', 'guis/rise.lua'):
              p = Path(gui)
              body = p.read_text()
              if old_get not in body:
                  raise SystemExit(f'{gui}: getcustomasset block not found')
              p.write_text(body.replace(old_get, new_get, 1))

          # Regression invariants.
          core = Path('guis/new.core.lua').read_text()
          assert 'license.SourceEndpoint' not in core
          assert 'license.SourceToken' not in core
          assert "local downloaded = pcall(downloadFile, path)" in core
          assert "body:sub(1, 8) == '\\137PNG\\r\\n\\26\\n'" in core
          assert "shared.AetherV2FetchSource(path, installedSourceRef())" in core
          for gui in ('guis/old.lua', 'guis/rise.lua'):
              body = Path(gui).read_text()
              assert "local downloaded = pcall(downloadFile, path)" in body

          print('asset downloader repaired')
          PY

      - name: Verify focused loader invariants
        shell: bash
        run: |
          node --test backend/private-execution-regression.test.js
          python3 - <<'PY'
          from pathlib import Path
          core = Path('guis/new.core.lua').read_text()
          assert 'aetherv2.onrender.com' not in core.lower()
          assert 'SourceEndpoint' not in core
          assert "getcustomasset = function(path)" in core
          assert "local downloaded = pcall(downloadFile, path)" in core
          print('focused asset checks passed')
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guis/new.core.lua guis/old.lua guis/rise.lua
          git commit -m "Fix GitHub asset downloads across GUIs"
          git push
