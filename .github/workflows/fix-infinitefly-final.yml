name: Final InfiniteFly fix

on:
  push:
    branches:
      - codex/fix-cloud-mousetp-scaffold-infinitefly-liquidglass

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Restore anti-void InfiniteFly
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('games/universal.lua'); s=p.read_text()
          start=s.find('run(function()\n    local InfiniteFly')
          end=s.find('run(function()\n    local HighJump', start)
          if start < 0 or end < 0: raise SystemExit(f'markers start={start} end={end}')
          old=subprocess.check_output(['git','show','a543c1cbdbaa0c1be9aea9c9458bdbfab5989f8c:games/universal.lua'], text=True)
          a=old.find('run(function()\n    -- InfiniteFly'); b=old.find('\nend)\n\nrun(function()', a)
          if a < 0 or b < 0: raise SystemExit(f'reference markers a={a} b={b}')
          p.write_text(s[:start]+old[a:b+4]+'\n\n'+s[end:])
          PY
      - name: Commit and clean up
        run: |
          rm -f .github/workflows/fix-infinitefly-final.yml .github/workflows/fix-infinitefly-debug.yml .infinitefly-debug.txt _infinitefly-debug-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore InfiniteFly anti-void replication cycle"
          git push origin HEAD:${GITHUB_REF_NAME}
