name: Fix InfiniteFly

on:
  push:
    branches:
      - codex/fix-cloud-mousetp-scaffold-infinitefly-liquidglass

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Replace InfiniteFly implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('games/universal.lua')
          s=p.read_text()
          start=s.find('run(function()\n\tlocal InfiniteFly')
          end=s.find('run(function()\n\tlocal HighJump', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate current InfiniteFly block')
          old=subprocess.check_output(['git','show','a543c1cbdbaa0c1be9aea9c9458bdbfab5989f8c:games/universal.lua'], text=True)
          a=old.find('run(function()\n    -- InfiniteFly')
          b=old.find('\nend)\n\nrun(function()', a)
          if a < 0 or b < 0:
              raise SystemExit('Could not locate reference InfiniteFly block')
          ref=old[a:b+4]  # include the closing end)
          p.write_text(s[:start]+ref+'\n\n'+s[end:])
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-infinitefly.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore InfiniteFly anti-void replication cycle"
          git push origin HEAD:${GITHUB_REF_NAME}
