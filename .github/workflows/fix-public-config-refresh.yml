name: Fix Public Config Refresh

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'plutoxqqqq/AetherV2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Public Config refresh
        shell: python
        run: |
          from pathlib import Path

          path = Path('guis/new.lua')
          text = path.read_text(encoding='utf-8')

          old = r'''\t\tlocal refreshing = false
\t\tfunction refresh()
\t\t\tif refreshing then return end
\t\t\trefreshing = true
\t\t\tfor _, v in dllist:GetChildren() do
\t\t\t\tif v:IsA('Frame') then v:Destroy() end
\t\t\tend
\t\t\ttable.clear(rowbuttons)
\t\t\tdlstatus.Text = 'Loading configs...'
\t\t\tdlstatus.Visible = true
\t\t\ttask.spawn(function()
\t\t\t\tlocal ok, res = pcall(function()
\t\t\t\t\treturn game:HttpGet(repoURL('presets.json'), true)
\t\t\t\tend)
\t\t\t\trefreshing = false
\t\t\t\tif not ok or not res or res == '404: Not Found' then
\t\t\t\t\tdlstatus.Text = 'Could not reach the repo. Check your connection and reopen'
\t\t\t\t\tmainapi:CreateNotification('Configs', 'Could not fetch the config list.', 7, 'alert')
\t\t\t\t\treturn
\t\t\t\tend
\t\t\t\tlocal decoded = select(2, pcall(function() return httpService:JSONDecode(res) end))
\t\t\t\tif type(decoded) ~= 'table' or type(decoded.presets) ~= 'table' then
\t\t\t\t\tdlstatus.Text = 'The config list is malformed'
\t\t\t\t\treturn
\t\t\t\tend
\t\t\t\tif #decoded.presets == 0 then
\t\t\t\t\tdlstatus.Text = 'No configs published yet'
\t\t\t\t\treturn
\t\t\t\tend
\t\t\t\tdlstatus.Visible = false
\t\t\t\tfor _, preset in decoded.presets do
\t\t\t\t\tpcall(makeRow, preset)
\t\t\t\tend
\t\t\t\trefreshRows()
\t\t\t\tapplyFilter()
\t\t\tend)
\t\tend'''.replace('\\t', '\t')

          new = r'''\t\tlocal refreshing = false
\t\tlocal function fetchLatestPresetCatalogue()
\t\t\t-- Refresh the live repository state. GitHub's Contents API resolves main
\t\t\t-- on every request instead of depending on raw.githubusercontent.com cache.
\t\t\tlocal cacheBust = tostring(os.time())..'-'..tostring(math.random(100000, 999999))
\t\t\tif requestFunction then
\t\t\t\tlocal ok, response = pcall(requestFunction, {
\t\t\t\t\tUrl = 'https://api.github.com/repos/plutoxqqqq/AetherV2/contents/configs/presets.json?ref=main&aether='..cacheBust,
\t\t\t\t\tMethod = 'GET',
\t\t\t\t\tHeaders = {
\t\t\t\t\t\tAccept = 'application/vnd.github.raw+json',
\t\t\t\t\t\t['Cache-Control'] = 'no-cache',
\t\t\t\t\t\tPragma = 'no-cache',
\t\t\t\t\t\t['User-Agent'] = 'AetherV2'
\t\t\t\t\t}
\t\t\t\t})
\t\t\t\tif ok and type(response) == 'table' then
\t\t\t\t\tlocal status = tonumber(response.StatusCode or response.Status) or 0
\t\t\t\t\tif status >= 200 and status < 300 and type(response.Body) == 'string' and response.Body ~= '' then
\t\t\t\t\t\treturn response.Body
\t\t\t\t\tend
\t\t\t\tend
\t\t\tend
\t\t\treturn game:HttpGet(repoURL('presets.json'), true)
\t\tend

\t\tfunction refresh()
\t\t\tif refreshing then return end
\t\t\trefreshing = true
\t\t\tfor _, v in dllist:GetChildren() do
\t\t\t\tif v:IsA('Frame') then v:Destroy() end
\t\t\tend
\t\t\ttable.clear(rowbuttons)
\t\t\tdlstatus.Text = 'Refreshing repo configs...'
\t\t\tdlstatus.Visible = true
\t\t\ttask.spawn(function()
\t\t\t\tlocal ok, res = pcall(fetchLatestPresetCatalogue)
\t\t\t\trefreshing = false
\t\t\t\tif not ok or not res or res == '404: Not Found' then
\t\t\t\t\tdlstatus.Text = 'Could not reach the latest repo config list'
\t\t\t\t\tmainapi:CreateNotification('Configs', 'Could not refresh the config list.', 7, 'alert')
\t\t\t\t\treturn
\t\t\t\tend
\t\t\t\tlocal decoded = select(2, pcall(function() return httpService:JSONDecode(res) end))
\t\t\t\tif type(decoded) ~= 'table' or type(decoded.presets) ~= 'table' then
\t\t\t\t\tdlstatus.Text = 'The config list is malformed'
\t\t\t\t\treturn
\t\t\t\tend
\t\t\t\tif #decoded.presets == 0 then
\t\t\t\t\tdlstatus.Text = 'No configs published yet'
\t\t\t\t\treturn
\t\t\t\tend
\t\t\t\tdlstatus.Visible = false
\t\t\t\tfor _, preset in decoded.presets do
\t\t\t\t\tpcall(makeRow, preset)
\t\t\t\tend
\t\t\t\trefreshRows()
\t\t\t\tapplyFilter()
\t\t\tend)
\t\tend'''.replace('\\t', '\t')

          if old not in text:
              raise SystemExit('Expected refresh block was not found; refusing to modify new.lua')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "AetherV2 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add guis/new.lua
          git diff --cached --quiet && exit 0
          git commit -m "Fix Public Config refresh to fetch latest repo state"
          git push origin main
