name: Flatten game files

on:
  push:
    branches:
      - flatten/single-game-files
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collapse split game folders into single files
        run: |
          set -euo pipefail
          if [ ! -f games/universal/bundle.lua ] && [ ! -f games/6872274481/bundle.lua ]; then
            echo 'Already flattened'
            exit 0
          fi
          if [ -f games/universal/bundle.lua ]; then
            cp games/universal/bundle.lua games/universal.lua
          fi
          if [ -f games/6872274481/bundle.lua ]; then
            cp games/6872274481/bundle.lua games/6872274481.lua
          fi
          rm -rf games/universal games/6872274481
          python3 - <<'PY'
          from pathlib import Path
          init = Path('init.lua')
          text = init.read_text(encoding='utf-8')
          text = text.replace(
              "include = path == 'games/universal.lua' or path == 'games/universal/bundle.lua' or path == 'games/'..place..'.lua'",
              "include = path == 'games/universal.lua' or path == 'games/'..place..'.lua'",
              1,
          )
          text = text.replace(
              "\t\t\t\t-- Universal executes from its generated bundle.  Fetch that one file with the\n\t\t\t\t-- normal startup pool instead of making the loader issue a request per module.\n",
              '',
              1,
          )
          init.write_text(text, encoding='utf-8')
          test = Path('backend/private-execution-regression.test.js')
          tt = test.read_text(encoding='utf-8')
          old = """  const bedwars = [\n    readLuaTree(path.join(games, '6872274481.lua')),\n    readLuaTree(path.join(games, '6872274481'))\n  ].join('\\n');"""
          new = "  const bedwars = readLuaTree(path.join(games, '6872274481.lua'));"
          if old not in tt:
              raise SystemExit('BedWars regression test block not found')
          test.write_text(tt.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Collapse universal and BedWars into single game files'
          git push
