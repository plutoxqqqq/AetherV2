name: Flatten PR 144 BedWars file

on:
  push:
    branches: [rewrite/autowin-v7-jik-v2]

permissions:
  contents: write

jobs:
  flatten:
    if: contains(github.event.head_commit.message, '[flatten-pr144]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/autowin-v7-jik-v2
          fetch-depth: 0
      - name: Flatten into games/6872274481.lua
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          g = Path('games')
          source = (g/'6872274481.base.lua').read_text()
          runtime = (g/'aether/rewrite.lua').read_text()
          patch = (g/'aether/rewrite_patch.lua').read_text().replace('libraries/bedwars/aether/rewrite.lua', 'inline Aether BedWars runtime')
          ports = (g/'aether/alsploit_ports.lua').read_text()
          trixie = (g/'aether/trixie_exploit.lua').read_text()

          def between(text, a, b, value, label):
              x = text.find(a)
              y = text.find(b, x + len(a)) if x >= 0 else -1
              if x < 0 or y < 0: raise RuntimeError(label + ' markers missing')
              return text[:x] + value + text[y:]

          def once(text, old, new, label):
              if text.count(old) != 1: raise RuntimeError(label + ' marker count != 1')
              return text.replace(old, new, 1)

          context = '''\tlocal context = {
\t\tvape = vape, vapeEvents = vapeEvents, entitylib = entitylib, bedwars = bedwars, store = store,
\t\tlplr = lplr, playersService = playersService, runService = runService,
\t\tcollectionService = collectionService, replicatedStorage = replicatedStorage, httpService = httpService,
\t\tguiService = guiService, coreGui = coreGui, gameCamera = gameCamera, inputService = inputService,
\t\tremotes = remotes, sortmethods = sortmethods, breakmethods = breakmethods, frictionTable = frictionTable,
\t\tupdateVelocity = updateVelocity, getItem = getItem, getWool = getWool, getBestArmor = getBestArmor,
\t\tgetPlacedBlock = getPlacedBlock, switchItem = switchItem, isnetworkowner = isnetworkowner,
\t\tnotif = notif, placeBlock = bedwars.placeBlock, breakBlock = bedwars.breakBlock,
\t\tdebug = debug, Knit = Knit, canDebug = canDebug
\t}
'''
          inline = (
              'local AetherMatchRuntime\nrun(function()\n' + context +
              '\tlocal function __AetherRuntime(...)\n' + runtime + '\n\tend\n' +
              "\tlocal ok, result = xpcall(function() return __AetherRuntime(context) end, debug and debug.traceback or tostring)\n" +
              "\tif not ok or type(result) ~= 'table' then warn('[AetherV2] AutoWin/JIK runtime failed: '..tostring(result)); return end\n" +
              '\tAetherMatchRuntime = result\n' +
              '\tlocal function __AetherPatch(...)\n' + patch + '\n\tend\n' +
              "\tlocal pok, perr = xpcall(function() return __AetherPatch(AetherMatchRuntime, context) end, debug and debug.traceback or tostring)\n" +
              "\tif not pok then warn('[AetherV2] AutoWin/JIK patch failed: '..tostring(perr)) end\n" +
              '\tlocal function __AetherPorts(...)\n' + ports + '\n\tend\n' +
              "\tlocal aok, aerr = xpcall(function() return __AetherPorts(AetherMatchRuntime, context) end, debug and debug.traceback or tostring)\n" +
              "\tif not aok then warn('[AetherV2] BedWars ports failed: '..tostring(aerr)) end\n" +
              '\tlocal function __AetherTrixieFactory()\n' + trixie + '\n\tend\n' +
              "\tlocal tok, terr = xpcall(function() local f = __AetherTrixieFactory(); return f and f(context) end, debug and debug.traceback or tostring)\n" +
              "\tif not tok then warn('[AetherV2] TrixieExploit failed: '..tostring(terr)) end\n" +
              'end)\n\n'
          )

          source = between(source,
              "run(function()\n    ----------------------------------------------------------------------------------------------\n    -- AutoWin (v6) - the unattended match brain.",
              "\nrun(function()\n    -- EntityAnalyser", inline, 'AutoWin')
          source = between(source,
              "-- Jade hammer execution has two strategies. TP performs the stock slam while following a\n-- moving target; Spoof keeps the server-side damage-scaling payload and never moves the character.\nrun(function()",
              "\nrun(function()\n    local Value\n    local CameraDir\n    local LimitItems",
              "-- JadeInstaKill V2 is registered by the inline AetherMatchRuntime above.\n", 'JadeInstaKill')

          jade = '''        jadeHammer = function(item, _, dir)
            local jade = AetherMatchRuntime and AetherMatchRuntime.Jade
            if jade then
                local result = jade:ActivateForTraversal('LongJump', dir, function() return not LongJump.Enabled end)
                if not result.confirmed or not LongJump.Enabled then return end
                JumpSpeed = 1.4 * Value.Value
                JumpTick = tick() + 2.5
                Direction = Vector3.new(dir.X, 0, dir.Z).Unit
                return
            end
            local ability = getJadeAbility(item)
            if not bedwars.AbilityController:canUseAbility(ability) then
                repeat task.wait(); ability = getJadeAbility(item) until bedwars.AbilityController:canUseAbility(ability) or not LongJump.Enabled
            end
            if bedwars.AbilityController:canUseAbility(ability) and LongJump.Enabled then
                if not activateJadeTool(item) then bedwars.AbilityController:useAbility(ability) end
                local deadline = tick() + 0.75
                repeat task.wait() until not bedwars.AbilityController:canUseAbility(ability) or tick() >= deadline or not LongJump.Enabled
                if not LongJump.Enabled or bedwars.AbilityController:canUseAbility(ability) then return end
                JumpSpeed = 1.4 * Value.Value
                JumpTick = tick() + 2.5
                Direction = Vector3.new(dir.X, 0, dir.Z).Unit
            end
        end,
'''
          source = between(source, "        jadeHammer = function(item, _, dir)\n", "        tnt = function(item, pos, dir)\n", jade, 'LongJump Jade')

          old = "\tmatchState = 0,\n\tqueueType = 'bedwars_test',\n\ttools = {}\n}"
          new = "\tmatchState = 0,\n\tqueueType = 'bedwars_test',\n\ttools = {},\n\tping = setmetatable({}, {\n\t\t__index = function(_, key)\n\t\t\tif key == 'total' or key == 'incoming' then\n\t\t\t\tlocal ok, value = pcall(lplr.GetNetworkPing, lplr)\n\t\t\t\treturn ok and math.max(tonumber(value) or 0, 0) or 0\n\t\t\tend\n\t\tend\n\t})\n}"
          source = once(source, old, new, 'cv ping')

          for token in ["Name = 'AutoWin'", "Name = 'JadeInstaKill'", "Name = 'TrixieExploit'", "Name = 'YaminiExploit'", "Name = 'JadeExploit'", "Name = 'AntiHitBETA'", "Name = 'NoFallDamageV2'", "Name = 'InstantWin'", "Name = 'AntiLagback'", "jade:ActivateForTraversal('LongJump'", "ping = setmetatable({}, {", "bedwars.CannonHandController:launchSelf(cannon)"]:
              if token not in source: raise RuntimeError('missing ' + token)
          for token in ['-- AutoWin (v6) - the unattended match brain.', 'Spoof keeps the server-side damage-scaling payload', "aetherv2/games/aether/", "6872274481.base.lua"]:
              if token in source: raise RuntimeError('stale split token ' + token)

          (g/'6872274481.lua').write_text(source)
          print('flattened bytes:', len(source.encode()))
          PY
          rm -f games/6872274481.base.lua
          rm -rf games/aether
          test -f games/6872274481.lua
          test ! -e games/6872274481.base.lua
          test ! -e games/aether
          grep -Fq "Name = 'AutoWin'" games/6872274481.lua
          grep -Fq "Name = 'JadeInstaKill'" games/6872274481.lua
          grep -Fq "Name = 'TrixieExploit'" games/6872274481.lua
          grep -Fq "bedwars.CannonHandController:launchSelf(cannon)" games/6872274481.lua
      - name: Commit to PR branch
        shell: bash
        run: |
          git config user.name 'AetherV2 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A games
          git commit -m 'Flatten BedWars rewrite into games/6872274481.lua'
          git push origin HEAD:rewrite/autowin-v7-jik-v2
