name: Luau syntax

on:
  pull_request:
    paths:
      - '**/*.lua'
      - 'tools/build-bedwars-bundle.py'
      - '.github/workflows/luau-syntax.yml'
  push:
    branches:
      - 'codex/fix-bedwars-bundle-nil-and-luau-syntax'

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}

      - name: Fix reported BedWars nil call
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('games/6872274481/main.lua')
          source = path.read_text(encoding='utf-8')
          old = "Runtime:InstallLongJumpJadeHook(moduleByName('LongJump'))"
          new = "Runtime:InstallLongJumpJadeHook(Runtime.ModuleByName and Runtime.ModuleByName('LongJump'))"
          if old in source:
              source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')
          elif new not in source:
              raise SystemExit('Expected LongJump Jade hook call was not found')
          PY

      - name: Rebuild BedWars bundle
        run: python3 tools/build-bedwars-bundle.py

      - name: Assemble Liquid Glass source for syntax validation
        shell: bash
        run: |
          cat \
            guis/liquidglass/01-runtime.lua \
            guis/liquidglass/02-shell.lua \
            guis/liquidglass/03-controls.lua \
            guis/liquidglass/04-controls-extra.lua \
            guis/liquidglass/05-inspector.lua \
            guis/liquidglass/06-pages.lua \
            > /tmp/liquidglass-full.lua

      - name: Install Luau compiler
        run: |
          curl -fsSL https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip -o /tmp/luau.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile

      - name: Check Luau syntax
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          check_file() {
            local file="$1"
            echo "Checking $file"
            if ! /tmp/luau/luau-compile "$file" >/tmp/luau.out 2>/tmp/luau.err; then
              failures=$((failures + 1))
              echo "=== $file ==="
              cat /tmp/luau.out
              cat /tmp/luau.err
            fi
          }
          while IFS= read -r -d '' file; do
            check_file "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -not -path './guis/liquidglass/*' -print0)
          check_file /tmp/liquidglass-full.lua
          if [ "$failures" -ne 0 ]; then
            echo "$failures Luau source(s) failed syntax compilation"
            exit 1
          fi

      - name: Commit repaired source and generated bundle
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- games/6872274481/main.lua games/6872274481/bundle.lua; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/6872274481/main.lua games/6872274481/bundle.lua
          git commit -m 'Fix BedWars LongJump Jade hook runtime call'
          git push origin HEAD:${{ github.ref_name }}

      - name: Ensure generated bundle is current
        if: success()
        run: |
          python3 tools/build-bedwars-bundle.py
          git diff --exit-code -- games/6872274481/bundle.lua
