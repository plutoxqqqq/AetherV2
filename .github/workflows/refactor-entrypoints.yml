name: Apply AetherV2 source refactor

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply refactor
        run: python tools/refactor-entrypoints.py
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore --source=origin/main -- .github/workflows/bedwars-structure.yml
          git restore --source=origin/main -- .github/workflows/refactor-entrypoints.yml
          git add -A
          git diff --cached --quiet || (git commit -m 'Refactor AetherV2 module discovery and entrypoints' && git push origin HEAD:${{ github.event.pull_request.head.ref }})
