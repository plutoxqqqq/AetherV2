name: Apply AetherV2 source refactor

on:
  push:
    branches: [refactor/auto-module-discovery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refactor
        run: python tools/refactor-entrypoints.py
      - name: Commit refactor
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet || (git commit -m 'Refactor AetherV2 module discovery and entrypoints' && git push origin HEAD:refactor/auto-module-discovery)
