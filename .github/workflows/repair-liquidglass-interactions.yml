name: Repair Liquid Glass interactions

on:
  push:
    branches:
      - fix/liquidglass-search-context-colour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Liquid Glass repairs
        run: python3 tools/repair-liquidglass-interactions-v2.py

      - name: Show changed files
        run: git diff --check && git status --short

      - name: Install Luau compiler
        run: |
          curl -fsSL https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip -o /tmp/luau.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau-compile

      - name: Validate changed Luau
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            guis/liquidglass.lua \
            guis/liquidglass/02-shell.lua \
            guis/liquidglass/05-inspector.lua; do
            echo "=== $file ==="
            /tmp/luau/luau-compile "$file"
          done

      - name: Commit repaired sources
        run: |
          if git diff --quiet; then
            echo 'No source changes were necessary.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add guis/liquidglass.lua guis/liquidglass/02-shell.lua guis/liquidglass/05-inspector.lua
          git commit -m 'fix: repair Liquid Glass search, context actions and legacy bleed'
          git push origin HEAD:fix/liquidglass-search-context-colour
