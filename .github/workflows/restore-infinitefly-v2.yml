name: Restore InfiniteFly v2

on:
  push:
    branches:
      - codex/fix-cloud-mousetp-scaffold-infinitefly-liquidglass

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('games/universal.lua'); current=p.read_text()
          start=current.find('run(function()\n    local InfiniteFly')
          end=current.find('run(function()\n    local HighJump', start)
          if start < 0 or end < 0: raise SystemExit(f'current markers {start} {end}')
          patch=subprocess.check_output(['git','show','--format=','--unified=0','a543c1cbdbaa0c1be9aea9c9458bdbfab5989f8c','--','games/universal.lua'], text=True)
          added=[line[1:] for line in patch.splitlines() if line.startswith('+') and not line.startswith('+++')]
          begin=next((i for i,line in enumerate(added) if line.strip()=='run(function()' and i+1<len(added) and 'InfiniteFly' in added[i+1]),-1)
          if begin<0: raise SystemExit('InfiniteFly added block not found in commit diff')
          finish=next((i for i in range(begin+1,len(added)) if added[i].strip()=='run(function()'),-1)
          if finish<0: raise SystemExit('end of InfiniteFly added block not found')
          block='\n'.join(added[begin:finish]).rstrip()
          p.write_text(current[:start]+block+'\n\n'+current[end:])
          PY
      - run: |
          rm -f .github/workflows/restore-infinitefly.yml .github/workflows/restore-infinitefly-v2.yml .github/workflows/diagnose-infinitefly.yml .infinitefly-debug.txt _diag-trigger.txt _restore-trigger.txt _final-infinitefly-trigger.txt _infinitefly-debug-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore InfiniteFly anti-void replication cycle"
          git push origin HEAD:${GITHUB_REF_NAME}
