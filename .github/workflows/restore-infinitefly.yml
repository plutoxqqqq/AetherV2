name: Restore InfiniteFly

on:
  push:
    branches:
      - codex/fix-cloud-mousetp-scaffold-infinitefly-liquidglass

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Restore InfiniteFly from its original implementation commit
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('games/universal.lua'); current=p.read_text()
          start=current.find('run(function()\n    local InfiniteFly')
          end=current.find('run(function()\n    local HighJump', start)
          if start < 0 or end < 0: raise SystemExit(f'current markers start={start} end={end}')
          patch=subprocess.check_output(['git','show','--format=','--unified=0','a543c1cbdbaa0c1be9aea9c9458bdbfab5989f8c','--','games/universal.lua'], text=True)
          a=patch.find('+run(function()\n+    -- InfiniteFly')
          b=patch.find('\n+run(function()', a+1)
          if a < 0 or b < 0: raise SystemExit(f'patch markers a={a} b={b}')
          block='\n'.join(line[1:] for line in patch[a:b].splitlines())
          p.write_text(current[:start]+block+'\n\n'+current[end:])
          PY
      - name: Commit and clean temporary files
        run: |
          rm -f .github/workflows/restore-infinitefly.yml .github/workflows/diagnose-infinitefly.yml .infinitefly-debug.txt _diag-trigger.txt _final-infinitefly-trigger.txt _infinitefly-debug-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore InfiniteFly anti-void replication cycle"
          git push origin HEAD:${GITHUB_REF_NAME}
