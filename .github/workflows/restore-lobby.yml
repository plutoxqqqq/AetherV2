name: Restore lobby modules

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-lobby.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch last full lobby and split
        run: |
          mkdir -p games
          curl -fsSL "https://raw.githubusercontent.com/plutoxqqqq/AetherV2/63fe5c38724a673f395ebb8168aefaf391a8e300/games/6872265039.lua" -o /tmp/lobby.lua
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util
          spec = importlib.util.spec_from_file_location('split', 'tools/split-games.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          dest = Path('games/6872265039')
          n = mod.split_monolith(Path('/tmp/lobby.lua'), dest)
          print('restored lobby modules', n)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/6872265039
          if git diff --cached --quiet; then
            echo No changes
            exit 0
          fi
          git commit -m "Restore BedWars lobby modules from last full copy"
          git pull --rebase origin main
          git push
