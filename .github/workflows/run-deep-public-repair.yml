name: Run deep public repair

on:
  push:
    branches:
      - main
    paths:
      - tools/finalize_deep_repair.py
      - .github/workflows/run-deep-public-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize repair script
        run: python3 tools/finalize_deep_repair.py
      - name: Apply repair
        run: python3 tools/deep_public_source_repair.py
      - name: Verify static invariants
        run: |
          python3 -c "from pathlib import Path; i=Path('init.lua').read_text(); m=Path('main.lua').read_text(); n=Path('guis/new.lua').read_text(); c=Path('guis/new.core.lua').read_text(); o=Path('guis/old.lua').read_text(); r=Path('guis/rise.lua').read_text(); assert 'shared.AetherV2PublicRef = commit' in i; assert 'verifySelectedAssets(prefetchPaths)' in i; assert \"getcustomasset('aetherv2/assets/new/loading.png')\" not in i; assert 'releasechannel' not in i.lower(); assert 'releasechannel' not in m.lower(); assert 'FALLBACK_COMMIT' not in n; assert 'shared.AetherV2PublicRef' in c; assert 'validDownloadedFile' in o and 'validDownloadedFile' in r"
      - name: Run regression tests
        run: cd backend && node --test private-execution-regression.test.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add init.lua main.lua guis/new.lua guis/new.core.lua guis/old.lua guis/rise.lua backend/private-execution-regression.test.js
          git commit -m "Fully repair public source and asset loading"
          git push
