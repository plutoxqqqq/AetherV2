name: Run premium backend repair

on:
  push:
    branches:
      - main
    paths:
      - tools/premium_backend_repair.py
      - .github/workflows/run-premium-backend-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        run: python3 tools/premium_backend_repair.py
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Check backend syntax
        run: cd backend && npm run check
      - name: Run backend tests
        run: cd backend && npm test
      - name: Verify architecture
        run: |
          python3 -c "from pathlib import Path; s=Path('backend/private-source.js').read_text(); b=Path('backend/discord-bot.js').read_text(); assert '/loader' not in s; assert \"url.pathname === '/authorize'\" not in s; assert \"url.pathname === '/source'\" not in s; assert \"url.pathname === '/premium/authorize'\" in s; assert \"url.pathname === '/premium/source'\" in s; assert \"url.pathname === '/premium/tree'\" in s; assert '/loader?key=' not in b; assert 'premiumKey = ' in b; assert 'const copyable =' in b"
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/private-source.js backend/private-source.test.js backend/discord-bot.js backend/discord-bot.test.js backend/README.md
          git commit -m "Make Render premium-only and update key bot"
          git push
