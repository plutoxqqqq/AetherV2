name: Run premium backend repair

on:
  push:
    branches:
      - main
    paths:
      - tools/premium_backend_repair.py
      - tools/finalize_premium_tests.py
      - .github/workflows/run-premium-backend-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply repair
        run: python3 tools/premium_backend_repair.py
      - name: Normalize generated JS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in (
              'backend/private-source.js',
              'backend/private-source.test.js',
              'backend/discord-bot.js',
              'backend/discord-bot.test.js',
          ):
              path = Path(name)
              text = path.read_text()
              text = text.replace("\\'use strict\\';", "'use strict';", 1)
              text = text.replace('\\\\', '\\')
              path.write_text(text)

          path = Path('backend/private-source.js')
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith('const PUBLIC_ORIGIN = '):
                  lines[index:index + 1] = [
                      "let PUBLIC_ORIGIN = String(process.env.PUBLIC_ORIGIN || '');",
                      "while (PUBLIC_ORIGIN.endsWith('/')) PUBLIC_ORIGIN = PUBLIC_ORIGIN.slice(0, -1);",
                  ]
                  break
          else:
              raise SystemExit('PUBLIC_ORIGIN declaration not found')
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Align premium-only regressions
        run: python3 tools/finalize_premium_tests.py
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Check backend syntax
        run: cd backend && npm run check
      - name: Run backend tests
        run: cd backend && npm test
      - name: Verify architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('backend/private-source.js').read_text()
          b = Path('backend/discord-bot.js').read_text()
          for route in ('/loader', '/authorize', '/source', '/commit', '/history', '/tree'):
              assert "url.pathname === '" + route + "'" not in s
          for route in ('/premium/authorize', '/premium/source', '/premium/tree'):
              assert "url.pathname === '" + route + "'" in s
          assert '/loader?key=' not in b
          assert 'premiumKey = ' in b
          assert 'const copyable =' in b
          assert "codeBlock(value, language) + '\\n' + inline(value)" in b
          print('premium-only architecture verification passed')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/private-source.js backend/private-source.test.js backend/discord-bot.js backend/discord-bot.test.js backend/private-execution-regression.test.js backend/key-registry.test.js backend/README.md
          git commit -m "Make Render premium-only and update key bot"
          git push
