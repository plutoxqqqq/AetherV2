name: Generate Universal Modules

on:
  push:
    branches:
      - feature/timer-timescale-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Timer in generated bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = """run(function()
    local Timer
    local Value

    Timer = vape.Categories.Blatant:CreateModule({
\tName = 'Timer',
\tFunction = function(callback)
\t\tif callback then
\t\t\tsetfflag('SimEnableStepPhysics', 'True')
\t\t\tsetfflag('SimEnableStepPhysicsSelective', 'True')
\t\t\tTimer:Clean(runService.RenderStepped:Connect(function(dt)
\t\t\t\tif Value.Value > 1 then
\t\t\t\t\trunService:Pause()
\t\t\t\t\tworkspace:StepPhysics(dt * (Value.Value - 1), { entitylib.character.RootPart })
\t\t\t\t\trunService:Run()
\t\t\t\tend
\t\t\tend))
\t\tend
\tend,
\tTooltip = 'Change the game speed',
    })
    Value = Timer:CreateSlider({
\tName = 'Value',
\tMin = 1,
\tMax = 3,
\tDecimal = 10,
    })
end)"""
          new = (Path('games/universal/blatant/Timer.lua')).read_text(encoding='utf-8')
          bundle_path = Path('games/universal/bundle.lua')
          bundle = bundle_path.read_text(encoding='utf-8')
          if old not in bundle:
              raise SystemExit('Existing Timer block was not found in generated bundle')
          bundle = bundle.replace(old, new, 1)
          bundle_path.write_text(bundle, encoding='utf-8')
          print('Patched Timer block in bundle without regenerating unrelated modules')
          PY

      - name: Validate Timer bundle
        run: |
          grep -q "Min = 0.1" games/universal/bundle.lua
          grep -q "animationSpeeds" games/universal/bundle.lua
          echo 'Timer bundle patch validated'

      - name: Commit generated bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/universal/bundle.lua
          git commit -m 'build: update universal Timer bundle'
          git push origin "HEAD:$GITHUB_REF_NAME"
