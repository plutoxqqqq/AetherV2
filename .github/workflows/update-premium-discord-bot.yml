name: Update premium Discord bot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-premium-discord-bot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply premium bot update
        shell: bash
        run: |
          echo 'ZnJvbSBwYXRobGliIGltcG9ydCBQYXRoCmltcG9ydCByZQoKYm90X3BhdGggPSBQYXRoKCdiYWNrZW5kL2Rpc2NvcmQtYm90LmpzJykKdGV4dCA9IGJvdF9wYXRoLnJlYWRfdGV4dCgpCgpkZWYgb25jZShvbGQsIG5ldywg ...'} | tr -d ' ' | base64 -d > /tmp/update-premium-discord-bot.py
          python3 /tmp/update-premium-discord-bot.py

      - name: Run focused Discord bot tests
        shell: bash
        run: |
          cd backend
          npm ci
          node --check discord-bot.js
          node --test discord-bot.test.js

      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/discord-bot.js backend/discord-bot.test.js backend/README.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update Discord bot for premium key flow"
          git push
